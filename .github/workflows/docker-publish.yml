name: Docker

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: "Version a publier (ex. 2.0). Vide = increment automatique."
        required: false
        type: string

concurrency:
  group: docker-publish
  cancel-in-progress: false

env:
  IMAGE: firewax/lumiconnect
  DOCKERHUB_USER: firewax

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec tsc --noEmit

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Calcule la version
        id: version
        run: |
          set -euo pipefail
          forced="${{ inputs.version }}"
          if [ -n "$forced" ]; then
            version="$forced"
          else
            latest=$(git tag --list 'v[0-9]*.[0-9]*' | sort -V | tail -n 1)
            if [ -z "$latest" ]; then
              version="1.0"
            else
              current="${latest#v}"
              major="${current%%.*}"
              minor="${current#*.}"
              version="${major}.$((minor + 1))"
            fi
          fi
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "::error::le tag v${version} existe deja"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version publiee : $version"

      - name: Verifie les secrets
        run: |
          missing=""
          [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ] || missing="$missing DOCKERHUB_TOKEN"
          [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ] || missing="$missing NEXT_PUBLIC_SUPABASE_URL"
          [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" ] || missing="$missing NEXT_PUBLIC_SUPABASE_ANON_KEY"
          if [ -n "$missing" ]; then
            echo "::error::secrets absents ou vides :$missing — Settings > Secrets and variables > Actions, onglet Secrets (pas Variables), section Repository secrets"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build et push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_ORIGIN=${{ vars.NEXT_PUBLIC_APP_ORIGIN || 'https://lumiconnect.fwx.pm' }}
            IMAGE_VERSION=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pose le tag git
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${version}" -m "Image ${{ env.IMAGE }}:${version}"
          git push origin "v${version}"

      - name: Recapitulatif
        run: |
          {
            echo "### Image publiee"
            echo ""
            echo '```'
            echo "docker pull ${{ env.IMAGE }}:${{ steps.version.outputs.version }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
