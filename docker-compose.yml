services:
  web:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    env_file: .env.local
    ports:
      - "${APP_PORT:-8002}:8002"
    restart: unless-stopped
    stop_grace_period: 120s
